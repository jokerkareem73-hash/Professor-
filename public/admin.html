<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>المدير - الاستاذ</title><style>body{font-family:sans-serif;background:#eee;margin:0}header{background:#111;color:#fff;padding:15px;text-align:center}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc}button{background:#d40000;color:#fff;border:none;font-weight:bold}.card{background:#fff;padding:10px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between}</style></head><body><header><h2>لوحة المدير - قطع غيار الاستاذ</h2></header><div style="padding:15px"><h3>اضافة قطعة</h3><input id="pname" placeholder="اسم القطعة"><input id="pprice" placeholder="السعر"><input type="file" id="pimage"><button onclick="addPart()">نزل</button><hr><div id="plist"></div><hr><h3>الطلبات 🔔</h3><audio id="sound" src="https://notificationsounds.com/storage/sounds/file-sounds-1153-pristine.mp3"></audio><div id="olist"></div></div><script>async function addPart(){let fd=new FormData();fd.append('name',pname.value);fd.append('price',pprice.value);fd.append('image',pimage.files[0]);await fetch('/api/parts',{method:'POST',body:fd});loadParts();}async function loadParts(){let r=await fetch('/api/parts');let d=await r.json();plist.innerHTML=d.map(p=>`<div class="card"><span>${p.name} - ${p.price}ج</span><button onclick="fetch('/api/parts/${'${p.id}'}',{method:'DELETE'}).then(()=>loadParts())" style="width:auto">حذف</button></div>`).join('');}async function loadOrders(){let r=await fetch('/api/orders');let o=await r.json();olist.innerHTML=o.map(x=>`<div class="card" style="display:block"><b>${x.customerName} - ${x.customerPhone}</b><br>${x.items.map(i=>i.name).join(', ')}<br>الاجمالي ${x.total}ج<br><a href="https://wa.me/${x.customerPhone}">رد واتساب</a></div>`).join('');}loadParts();loadOrders();setInterval(loadOrders,10000);</script></body></html>
